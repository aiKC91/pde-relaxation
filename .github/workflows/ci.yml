name: CI

on:
  push:
    branches: [ ETERNAFX ]
  pull_request:
    branches: [ ETERNAFX ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy pytest
    - name: Run tests
      run: |
        pytest -q
