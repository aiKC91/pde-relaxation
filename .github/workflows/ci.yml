name: CI

on:
  push:
    branches: [ ETERNAFX, feature/enhancements, feature/integrations ]
  pull_request:
    branches: [ ETERNAFX ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy pytest black
    - name: Format code with Black (non-failing)
      run: |
        # Run black to format files in the runner. This keeps CI green even if
        # contributors didn't format locally. It does not commit changes back.
        python -m black . || true
    - name: Run unit tests
      run: |
        pytest -q
    - name: Checkout external repositories (optional)
      run: |
        chmod +x tools/checkout_externals.sh
        ./tools/checkout_externals.sh
